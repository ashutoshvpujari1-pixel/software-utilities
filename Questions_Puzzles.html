<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Technical Puzzle - Test your programming and software development knowledge.">

    <title>Technical Puzzle</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MQJRN78HQR"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-MQJRN78HQR');

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 17px;
            opacity: 0.9;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 30px auto;
        }

        #loading {
            text-align: center;
            font-size: 20px;
            padding: 40px;
        }

        .question-card {
            background: white;
            margin-bottom: 25px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-left: 6px solid #2563eb;
        }

        .question-number {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            cursor: pointer;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        .option:hover {
            background: #eff6ff;
            border-color: #2563eb;
        }

        .option input {
            margin-top: 4px;
            transform: scale(1.25);
            cursor: pointer;
        }

        .option-text {
            font-size: 17px;
            line-height: 1.4;
        }

        .result {
            display: none;
            margin-top: 18px;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.5;
        }

        .correct {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .incorrect {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .explanation {
            margin-top: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
        }

        .submit-section {
            text-align: center;
            margin: 35px 0;
        }

        #submitBtn,
        #restartBtn {
            border: none;
            padding: 16px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #submitBtn {
            background: #2563eb;
            color: white;
            box-shadow: 0 5px 15px rgba(37,99,235,0.3);
        }

        #restartBtn {
            background: #475569;
            color: white;
            margin-left: 10px;
        }

        #submitBtn:hover,
        #restartBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(0,0,0,0.2);
        }

        #scoreCard {
            display: none;
            text-align: center;
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #scoreTitle {
            font-size: 30px;
            margin-bottom: 10px;
        }

        #score {
            font-size: 42px;
            font-weight: bold;
            color: #2563eb;
        }

        #percentage {
            font-size: 22px;
            margin-top: 8px;
        }

        .progress-container {
            height: 12px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px auto;
            max-width: 600px;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.5s ease;
        }

        footer {
            text-align: center;
            background: #0f172a;
            color: #cbd5e1;
            padding: 22px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            .question {
                font-size: 18px;
            }

            .option-text {
                font-size: 16px;
            }

            #submitBtn,
            #restartBtn {
                width: 100%;
                margin: 5px 0;
            }

            .question-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🧩 Technical Puzzle</h1>
    <p>Test your programming and software development knowledge</p>
</header>

<div class="container">

    <div id="loading">
        Loading questions...
    </div>

    <div id="scoreCard">

        <div id="scoreTitle">🎯 Your Result</div>

        <div id="score">0 / 0</div>

        <div id="percentage">0%</div>

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <p id="resultMessage"></p>

    </div>

    <div id="questionsContainer"></div>

    <div class="submit-section">

        <button id="submitBtn" onclick="submitAnswers()">
            ✅ Submit All Answers
        </button>

        <button id="restartBtn" onclick="restartQuiz()">
            🔄 Restart
        </button>

    </div>

</div>

<footer>
    Technical Puzzle | Programming Knowledge Challenge
</footer>


<script>

    let questions = [];


    /*
     * Load questions from JSON file
     */
    async function loadQuestions() {

        try {

            const response =
                await fetch("questions_answers.json");

            if (!response.ok) {
                throw new Error(
                    "Unable to load questions_answers.json"
                );
            }

            questions = await response.json();

            document.getElementById("loading")
                .style.display = "none";

            displayQuestions();

        } catch (error) {

            document.getElementById("loading").innerHTML =
                "❌ Error loading questions.<br><br>" +
                error.message +
                "<br><br>" +
                "Make sure questions_answers.json is in the same folder.";

            console.error(error);
        }
    }


    /*
     * Display all questions
     */
    function displayQuestions() {

        const container =
            document.getElementById("questionsContainer");

        container.innerHTML = "";


        questions.forEach((question, questionIndex) => {

            const card =
                document.createElement("div");

            card.className = "question-card";

            let optionsHTML = "";


            question.options.forEach((option, optionIndex) => {

                optionsHTML += `
                    <label class="option">

                        <input
                            type="radio"
                            name="question_${questionIndex}"
                            value="${escapeHTML(option)}"
                        >

                        <span class="option-text">
                            ${escapeHTML(option)}
                        </span>

                    </label>
                `;

            });


            card.innerHTML = `

                <div class="question-number">
                    Question ${questionIndex + 1}
                </div>

                <div class="question">
                    ${escapeHTML(question.question)}
                </div>

                <div>
                    ${optionsHTML}
                </div>

                <div
                    id="result_${questionIndex}"
                    class="result">
                </div>

            `;


            container.appendChild(card);

        });

    }


    /*
     * Submit all answers
     */
    function submitAnswers() {

        if (questions.length === 0) {
            return;
        }


        let correctCount = 0;


        questions.forEach((question, questionIndex) => {

            const selected =
                document.querySelector(
                    `input[name="question_${questionIndex}"]:checked`
                );


            const result =
                document.getElementById(
                    `result_${questionIndex}`
                );


            result.style.display = "block";


            /*
             * No answer selected
             */
            if (!selected) {

                result.className =
                    "result incorrect";

                result.innerHTML = `
                    <strong>❌ No answer selected.</strong>

                    <div class="explanation">
                        <strong>Correct Answer:</strong>
                        ${escapeHTML(question.answer)}
                        <br><br>
                        <strong>Explanation:</strong>
                        ${escapeHTML(question.explanation)}
                    </div>
                `;

                return;
            }


            /*
             * Check answer
             */
            if (selected.value === question.answer) {

                correctCount++;

                result.className =
                    "result correct";

                result.innerHTML = `
                    <strong>✅ Correct Answer!</strong>

                    <div class="explanation">
                        <strong>Explanation:</strong>
                        ${escapeHTML(question.explanation)}
                    </div>
                `;

            } else {

                result.className =
                    "result incorrect";

                result.innerHTML = `
                    <strong>❌ Incorrect Answer.</strong>

                    <div class="explanation">

                        <strong>Your Answer:</strong>
                        ${escapeHTML(selected.value)}

                        <br><br>

                        <strong>Correct Answer:</strong>
                        ${escapeHTML(question.answer)}

                        <br><br>

                        <strong>Explanation:</strong>
                        ${escapeHTML(question.explanation)}

                    </div>
                `;

            }

        });


        showScore(correctCount);

    }


    /*
     * Display final score
     */
    function showScore(correctCount) {

        const total = questions.length;

        const percentage =
            Math.round((correctCount / total) * 100);


        document.getElementById("score").innerText =
            `${correctCount} / ${total}`;


        document.getElementById("percentage").innerText =
            `${percentage}% Correct`;


        document.getElementById("progress").style.width =
            `${percentage}%`;


        let message;


        if (percentage === 100) {

            message =
                "🏆 Excellent! You answered every question correctly.";

        } else if (percentage >= 80) {

            message =
                "🎉 Very good! You have strong technical knowledge.";

        } else if (percentage >= 60) {

            message =
                "👍 Good attempt! Keep improving your technical skills.";

        } else if (percentage >= 40) {

            message =
                "📚 Keep practicing and strengthen your fundamentals.";

        } else {

            message =
                "💡 Keep learning and try the puzzle again.";

        }


        document.getElementById("resultMessage").innerText =
            message;


        document.getElementById("scoreCard")
            .style.display = "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
     * Restart puzzle
     */
    function restartQuiz() {

        document.querySelectorAll(
            'input[type="radio"]'
        ).forEach(input => {

            input.checked = false;

        });


        document.querySelectorAll(
            ".result"
        ).forEach(result => {

            result.style.display = "none";
            result.innerHTML = "";

        });


        document.getElementById("scoreCard")
            .style.display = "none";


        document.getElementById("progress")
            .style.width = "0%";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
     * Protect HTML from special characters
     */
    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value == null ? "" : value;

        return div.innerHTML;

    }


    /*
     * Start application
     */
    loadQuestions();

</script>

</body>
</html>
