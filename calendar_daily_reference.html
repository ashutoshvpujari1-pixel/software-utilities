</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Toast Notification Container (Replaces alert() cleanly) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Top Live Banner -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <!-- Brand & Live Date -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Today</span>
                        <span class="inline-flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    </div>
                    <h1 id="live-date-banner" class="text-base sm:text-lg font-bold text-slate-900 leading-tight">
                        Loading date...
                    </h1>
                </div>
            </div>

            <!-- Live Clock & Quick Utilities -->
            <div class="flex items-center justify-between sm:justify-end gap-3">
                <div class="bg-slate-100 px-3.5 py-1.5 rounded-xl border border-slate-200/80 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="live-clock" class="font-mono text-sm sm:text-base font-semibold text-slate-800 tracking-tight">
                        00:00:00
                    </span>
                </div>

                <div class="flex items-center gap-2 no-print">
                    <button id="btn-copy-today" title="Copy Today's Date" class="p-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 hover:border-indigo-300 hover:bg-indigo-50/50 transition-all shadow-xs active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                    </button>
                    <button id="btn-print" title="Print Calendar" class="p-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 hover:border-indigo-300 hover:bg-indigo-50/50 transition-all shadow-xs active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                        </svg>

        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Column: Interactive Monthly Calendar (8 cols on desktop) -->
            <section class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden print-full">
                
                <!-- Calendar Controls Toolbar -->
                <div class="p-4 sm:p-5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 bg-white">

                                <!-- Populated via JS -->
                            </select>

                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>

                        <div class="relative">
                            <select id="select-year" aria-label="Select Year" class="appearance-none bg-slate-50 border border-slate-200 text-slate-900 font-bold text-base sm:text-lg rounded-xl pl-3.5 pr-9 py-2 hover:border-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer">
                                <!-- Populated via JS -->

                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>

                    <!-- Navigation Buttons -->
                    <div class="flex items-center gap-2 no-print">

                        <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/80">

                                </svg>

                        </div>
                    </div>
                </div>

                <!-- Weekday Column Headers -->
                <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50/80">
                    <div class="py-3 text-center text-xs font-bold uppercase tracking-wider text-rose-600">Sun</div>
                    <div class="py-3 text-center text-xs font-bold uppercase tracking-wider text-slate-500">Mon</div>
                    <div class="py-3 text-center text-xs font-bold uppercase tracking-wider text-slate-500">Tue</div>
                    <div class="py-3 text-center text-xs font-bold uppercase tracking-wider text-slate-500">Wed</div>
                    <div class="py-3 text-center text-xs font-bold uppercase tracking-wider text-slate-500">Thu</div>
                    <div class="py-3 text-center text-xs font-bold uppercase tracking-wider text-slate-500">Fri</div>
                    <div class="py-3 text-center text-xs font-bold uppercase tracking-wider text-indigo-600">Sat</div>

                <!-- Legend Footer -->
                <div class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
                    <div class="flex items-center gap-4">

            <!-- Right Column: Selected Date Inspector & Local Notes (4 cols on desktop) -->
            <aside class="lg:col-span-4 flex flex-col gap-6 no-print">
                
                <!-- Selected Date Details Card -->

                        <div>

                                Today

                    <!-- Date Metrics Grid -->

                            <span id="stat-week-number" class="block text-lg font-extrabold text-indigo-600 mt-0.5">--</span>
                        </div>
                        <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                            <span class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">Days Left</span>
                            <span id="stat-days-remaining" class="block text-lg font-extrabold text-slate-800 mt-0.5">--</span>
                        </div>
                    </div>
                </div>

                <!-- Daily Notes Card (Stored in localStorage) -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">

                                <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                                <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" />
                            </svg>
                            <h3 class="font-bold text-slate-900 text-sm">Daily Notes</h3>

                        <span id="note-status" class="text-xs text-slate-400">Saved locally</span>
                    </div>

                    <textarea 
                        id="daily-note-input" 
                        rows="5" 
                        placeholder="Jot down reminders, milestones, or daily notes for this date..."
                        class="w-full rounded-xl bg-slate-50 border border-slate-200 p-3 text-sm text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all resize-y"
                    ></textarea>

                            Clear Note

                        <button id="btn-save-note" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-xs transition-all active:scale-95">

    <!-- Hidden textarea for reliable clipboard copying inside sandboxed iframes -->
    <textarea id="clipboard-helper" class="sr-only" aria-hidden="true"></textarea>

    <script>
        /**
         * Daily Reference Calendar Application
         * Completely self-contained client-side calendar with localStorage persistence.
         */
        document.addEventListener('DOMContentLoaded', () => {
            // --- Constants & State ---
            const MONTH_NAMES = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            const STORAGE_KEY = 'daily_ref_calendar_notes_v1';

            let today = new Date();
            let currentViewYear = today.getFullYear();
            let currentViewMonth = today.getMonth();
            let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            let notesStore = loadNotesFromStorage();

            // --- DOM Elements ---
            const liveDateBannerEl = document.getElementById('live-date-banner');
            const liveClockEl = document.getElementById('live-clock');
            const selectMonthEl = document.getElementById('select-month');
            const selectYearEl = document.getElementById('select-year');
            const calendarGridEl = document.getElementById('calendar-grid');

            const detailRelativeBadgeEl = document.getElementById('detail-relative-badge');
            const detailFullDateEl = document.getElementById('detail-full-date');
            const detailIsoDateEl = document.getElementById('detail-iso-date');
            const statDayOfYearEl = document.getElementById('stat-day-of-year');
            const statWeekNumberEl = document.getElementById('stat-week-number');
            const statDaysRemainingEl = document.getElementById('stat-days-remaining');

            const noteInputEl = document.getElementById('daily-note-input');
            const noteStatusEl = document.getElementById('note-status');
            const clipboardHelperEl = document.getElementById('clipboard-helper');

            // --- Initialization ---
            initSelectors();
            updateLiveClock();
            setInterval(updateLiveClock, 1000);
            renderCalendar();
            updateSelectedDatePanel();
            bindEvents();

            // --- Storage Helpers ---
            function loadNotesFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch (e) {
                    console.warn('LocalStorage unavailable:', e);
                    return {};
                }
            }

            function saveNotesToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(notesStore));
                } catch (e) {
                    showToast('Could not save to browser storage.', 'error');
                }
            }

            // --- Date Formatting & Math Utilities ---
            function formatDateKey(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function isSameDay(d1, d2) {
                return d1.getFullYear() === d2.getFullYear() &&
                       d1.getMonth() === d2.getMonth() &&
                       d1.getDate() === d2.getDate();
            }

            function isLeapYear(year) {
                return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            }

            function getDayOfYear(date) {
                const start = new Date(date.getFullYear(), 0, 0);
                const diff = (date - start) + ((start.getTimezoneOffset() - date.getTimezoneOffset()) * 60 * 1000);
                const oneDay = 1000 * 60 * 60 * 24;
                return Math.floor(diff / oneDay);
            }

            function getISOWeekNumber(date) {
                const tempDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                const dayNum = tempDate.getUTCDay() || 7;
                tempDate.setUTCDate(tempDate.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(tempDate.getUTCFullYear(), 0, 1));
                return Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);
            }

            function getRelativeDayLabel(targetDate, baseToday) {
                const t1 = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
                const t2 = new Date(baseToday.getFullYear(), baseToday.getMonth(), baseToday.getDate());
                const diffDays = Math.round((t1 - t2) / (1000 * 60 * 60 * 24));

                if (diffDays === 0) return 'Today';
                if (diffDays === 1) return 'Tomorrow';
                if (diffDays === -1) return 'Yesterday';
                if (diffDays > 1) return `In ${diffDays} days`;
                return `${Math.abs(diffDays)} days ago`;
            }

            // --- UI Updaters ---
            function updateLiveClock() {
                const now = new Date();
                
                // Detect midnight rollover automatically
                if (!isSameDay(now, today)) {
                    today = now;
                    renderCalendar();
                    updateSelectedDatePanel();
                }

                const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                liveDateBannerEl.textContent = now.toLocaleDateString('en-US', dateOptions);
                liveClockEl.textContent = now.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
            }

            function initSelectors() {
                // Populate Months
                MONTH_NAMES.forEach((month, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = month;
                    selectMonthEl.appendChild(opt);
                });

                // Populate Years (1900 to 2100)
                const startYear = 1900;
                const endYear = 2100;
                for (let y = startYear; y <= endYear; y++) {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y;
                    selectYearEl.appendChild(opt);
                }
            }

            function syncSelectors() {
                selectMonthEl.value = currentViewMonth;
                selectYearEl.value = currentViewYear;
            }

            function renderCalendar() {
                syncSelectors();
                calendarGridEl.innerHTML = '';

                const firstDayOfMonth = new Date(currentViewYear, currentViewMonth, 1).getDay();
                const daysInMonth = new Date(currentViewYear, currentViewMonth + 1, 0).getDate();
                const daysInPrevMonth = new Date(currentViewYear, currentViewMonth, 0).getDate();

                // Always render 42 cells (6 rows x 7 cols) for consistent layout height
                const totalCells = 42;

                for (let i = 0; i < totalCells; i++) {
                    let cellDate;
                    let isCurrentMonth = true;

                    if (i < firstDayOfMonth) {
                        // Trailing days from previous month
                        const dayNum = daysInPrevMonth - firstDayOfMonth + i + 1;
                        cellDate = new Date(currentViewYear, currentViewMonth - 1, dayNum);
                        isCurrentMonth = false;
                    } else if (i >= firstDayOfMonth + daysInMonth) {
                        // Leading days from next month
                        const dayNum = i - (firstDayOfMonth + daysInMonth) + 1;
                        cellDate = new Date(currentViewYear, currentViewMonth + 1, dayNum);
                        isCurrentMonth = false;
                    } else {
                        // Active month days
                        const dayNum = i - firstDayOfMonth + 1;
                        cellDate = new Date(currentViewYear, currentViewMonth, dayNum);
                    }

                    const dateKey = formatDateKey(cellDate);
                    const isTodayCell = isSameDay(cellDate, today);
                    const isSelectedCell = isSameDay(cellDate, selectedDate);
                    const dayOfWeek = cellDate.getDay();
                    const isSunday = dayOfWeek === 0;
                    const isSaturday = dayOfWeek === 6;
                    const hasNote = Boolean(notesStore[dateKey] && notesStore[dateKey].trim().length > 0);

                    // Build Cell Button
                    const cellBtn = document.createElement('button');
                    cellBtn.type = 'button';
                    cellBtn.setAttribute('aria-label', cellDate.toDateString());

                    // Base cell styling
                    let cellClasses = [
                        'calendar-cell', 'relative', 'min-h-[68px]', 'sm:min-h-[84px]', 'p-2',
                        'flex', 'flex-col', 'justify-between', 'items-start', 'text-left',
                        'transition-all', 'focus:outline-none', 'focus:z-10', 'focus:ring-2', 'focus:ring-indigo-500'
                    ];

                    if (!isCurrentMonth) {
                        cellClasses.push('bg-slate-50/60', 'text-slate-400', 'hover:bg-slate-100/80');
                    } else if (isSelectedCell) {
                        cellClasses.push('bg-indigo-50/70', 'ring-2', 'ring-inset', 'ring-indigo-600', 'z-10');
                    } else if (isSunday) {
                        cellClasses.push('bg-rose-50/30', 'hover:bg-rose-50/70');
                    } else if (isSaturday) {
                        cellClasses.push('bg-slate-50/40', 'hover:bg-indigo-50/30');
                    } else {
                        cellClasses.push('bg-white', 'hover:bg-slate-50');
                    }

                    cellBtn.className = cellClasses.join(' ');

                    // Top row inside cell: Day Number & Today Badge
                    const topRow = document.createElement('div');
                    topRow.className = 'w-full flex items-center justify-between gap-1';

                    const dayBadge = document.createElement('span');
                    dayBadge.textContent = cellDate.getDate();

                    if (isTodayCell) {
                        dayBadge.className = 'w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs sm:text-sm flex items-center justify-center shadow-xs';
                    } else {
                        let numColor = isCurrentMonth ? 'text-slate-800' : 'text-slate-400';
                        if (isCurrentMonth && isSunday) numColor = 'text-rose-600';
                        if (isCurrentMonth && isSaturday) numColor = 'text-indigo-600';
                        dayBadge.className = `w-7 h-7 rounded-full flex items-center justify-center text-xs sm:text-sm font-semibold ${numColor}`;
                    }

                    topRow.appendChild(dayBadge);

                    if (isTodayCell) {
                        const todayTag = document.createElement('span');
                        todayTag.textContent = 'TODAY';
                        todayTag.className = 'hidden sm:inline-block text-[9px] font-extrabold tracking-wider uppercase px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700';
                        topRow.appendChild(todayTag);
                    }

                    cellBtn.appendChild(topRow);

                    // Bottom row inside cell: Note indicator preview
                    if (hasNote) {
                        const noteIndicator = document.createElement('div');
                        noteIndicator.className = 'w-full mt-1 flex items-center gap-1';
                        
                        const dot = document.createElement('span');
                        dot.className = 'w-2 h-2 rounded-full bg-amber-500 shrink-0';
                        
                        const snippet = document.createElement('span');
                        snippet.textContent = notesStore[dateKey];
                        snippet.className = 'hidden sm:block text-[11px] text-slate-600 truncate font-medium';

                        noteIndicator.appendChild(dot);
                        noteIndicator.appendChild(snippet);
                        cellBtn.appendChild(noteIndicator);
                    }

                    // Click handler to select date
                    cellBtn.addEventListener('click', () => {
                        selectedDate = cellDate;
                        // If user clicked a trailing/leading month day, smoothly switch view to that month
                        if (!isCurrentMonth) {
                            currentViewYear = cellDate.getFullYear();
                            currentViewMonth = cellDate.getMonth();
                        }
                        renderCalendar();
                        updateSelectedDatePanel();
                    });

                    calendarGridEl.appendChild(cellBtn);
                }
            }

            function updateSelectedDatePanel() {
                const fullOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                detailFullDateEl.textContent = selectedDate.toLocaleDateString('en-US', fullOptions);
                
                const isoKey = formatDateKey(selectedDate);
                detailIsoDateEl.textContent = isoKey;

                const relLabel = getRelativeDayLabel(selectedDate, today);
                detailRelativeBadgeEl.textContent = relLabel;
                if (relLabel === 'Today') {
                    detailRelativeBadgeEl.className = 'inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-600 text-white mb-1.5';
                } else {
                    detailRelativeBadgeEl.className = 'inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 mb-1.5';
                }

                // Calculate Date Stats
                const dayOfYear = getDayOfYear(selectedDate);
                const totalDaysInYear = isLeapYear(selectedDate.getFullYear()) ? 366 : 365;
                const daysRemaining = totalDaysInYear - dayOfYear;
                const weekNum = getISOWeekNumber(selectedDate);

                statDayOfYearEl.textContent = `${dayOfYear} / ${totalDaysInYear}`;
                statWeekNumberEl.textContent = `W${String(weekNum).padStart(2, '0')}`;
                statDaysRemainingEl.textContent = daysRemaining;

                // Load note for selected date
                const existingNote = notesStore[isoKey] || '';
                noteInputEl.value = existingNote;
                noteStatusEl.textContent = existingNote ? 'Saved locally' : 'No note yet';
            }

            // --- Event Listeners ---
            function bindEvents() {
                // Month & Year Dropdowns
                selectMonthEl.addEventListener('change', (e) => {
                    currentViewMonth = parseInt(e.target.value, 10);
                    renderCalendar();
                });

                selectYearEl.addEventListener('change', (e) => {
                    currentViewYear = parseInt(e.target.value, 10);
                    renderCalendar();
                });

                // Previous Month
                document.getElementById('btn-prev-month').addEventListener('click', () => {
                    currentViewMonth--;
                    if (currentViewMonth < 0) {
                        currentViewMonth = 11;
                        currentViewYear--;
                    }
                    renderCalendar();
                });

                // Next Month
                document.getElementById('btn-next-month').addEventListener('click', () => {
                    currentViewMonth++;
                    if (currentViewMonth > 11) {
                        currentViewMonth = 0;
                        currentViewYear++;
                    }
                    renderCalendar();
                });

                // Jump to Today
                document.getElementById('btn-today').addEventListener('click', () => {
                    today = new Date();
                    currentViewYear = today.getFullYear();
                    currentViewMonth = today.getMonth();
                    selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                    renderCalendar();
                    updateSelectedDatePanel();
                    showToast('Jumped to Today');
                });

                // Save Note
                document.getElementById('btn-save-note').addEventListener('click', () => {
                    const key = formatDateKey(selectedDate);
                    const text = noteInputEl.value.trim();
                    if (text) {
                        notesStore[key] = text;
                        noteStatusEl.textContent = 'Saved just now';
                        showToast('Daily note saved');
                    } else {
                        delete notesStore[key];
                        noteStatusEl.textContent = 'No note yet';
                        showToast('Empty note cleared');
                    }
                    saveNotesToStorage();
                    renderCalendar();
                });

                // Clear Note
                document.getElementById('btn-clear-note').addEventListener('click', () => {
                    const key = formatDateKey(selectedDate);
                    noteInputEl.value = '';
                    if (notesStore[key]) {
                        delete notesStore[key];
                        saveNotesToStorage();
                        renderCalendar();
                        showToast('Note cleared');
                    }
                    noteStatusEl.textContent = 'No note yet';
                });

                // Copy Today's Date
                document.getElementById('btn-copy-today').addEventListener('click', () => {
                    const formatted = today.toLocaleDateString('en-US', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });
                    copyTextToClipboard(formatted, `Copied: ${formatted}`);
                });

                // Copy Selected Date
                document.getElementById('btn-copy-selected').addEventListener('click', () => {
                    const formatted = selectedDate.toLocaleDateString('en-US', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });
                    copyTextToClipboard(formatted, `Copied: ${formatted}`);
                });

                // Print Calendar
                document.getElementById('btn-print').addEventListener('click', () => {
                    window.print();
                });

                // Keyboard Arrow Navigation for Calendar
                document.addEventListener('keydown', (e) => {
                    // Ignore if user is typing inside the textarea or select menus
                    if (['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;

                    if (e.key === 'ArrowLeft') {
                        selectedDate.setDate(selectedDate.getDate() - 1);
                        currentViewYear = selectedDate.getFullYear();
                        currentViewMonth = selectedDate.getMonth();
                        renderCalendar();
                        updateSelectedDatePanel();
                    } else if (e.key === 'ArrowRight') {
                        selectedDate.setDate(selectedDate.getDate() + 1);
                        currentViewYear = selectedDate.getFullYear();
                        currentViewMonth = selectedDate.getMonth();
                        renderCalendar();
                        updateSelectedDatePanel();
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        selectedDate.setDate(selectedDate.getDate() - 7);
                        currentViewYear = selectedDate.getFullYear();
                        currentViewMonth = selectedDate.getMonth();
                        renderCalendar();
                        updateSelectedDatePanel();
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        selectedDate.setDate(selectedDate.getDate() + 7);
                        currentViewYear = selectedDate.getFullYear();
                        currentViewMonth = selectedDate.getMonth();
                        renderCalendar();
                        updateSelectedDatePanel();
                    }
                });
            }

            // --- Clipboard & Toast Utilities ---
            function copyTextToClipboard(text, successMsg) {
                try {
                    clipboardHelperEl.value = text;
                    clipboardHelperEl.select();
                    clipboardHelperEl.setSelectionRange(0, 99999);
                    const ok = document.execCommand('copy');
                    if (ok) {
                        showToast(successMsg);
                    } else {
                        showToast('Unable to copy date', 'error');
                    }
                } catch (err) {
                    showToast('Unable to copy date', 'error');
                }
            }

            function showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                const bgClass = type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
                toast.className = `${bgClass} text-white text-xs sm:text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0`;
                toast.textContent = message;

                container.appendChild(toast);

                // Animate in
                requestAnimationFrame(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                });

                // Remove after 2.6 seconds
                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 2600);
            }
        });
    </script>
</body>
</html>
